<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-container">
        <aside class="image">
            <img src="creed.JPG" alt="assassin creed">
            <div class="logo-box">
                <img src="logo.png" alt="ODIN LOGO" class="logo">
                <span>ODIN</span>
            </div>
        </aside>

        <div class="user-input">
            <div class="message">
                <p>This is not a real online service! You know you need something like  this in your life to help you realise your deepest dreams.Sign up now to get started.  
                </p>
                <p>You know you want to.</p>
            </div>
            <div class="start"><h3>Lets do this!</h3></div>
            <hr class="breaker">
            <div class="form">
                
                <form class="actual-form">
                    
                    <div class="user-form">
                        
                        <div>
                            <label for="first-name">First Name</label>
                            <input type="text" id = "first-name" name="firstname" required>
                        </div>

                        <div>
                            <label for="second-name">Second Name</label>
                            <input type="text" id="second-name" name="secondname" required>
                        </div>

                        <div>
                            <label for="user-email">Email Address</label>
                            <input type="email" id="user-email" name="email" required>
                        </div>

                        <div>
                            <label for="number">Phone Number</label>
                            <input type="tel" id="number" name="number" required>
                        </div>

                        <div>
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div>
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </div>
                    </div>
                    <hr class="breaker">
                    <div class="user-account">
                        <button>Create Account</button>
                        <p>Already have an account? <a href="https://github.com/lordscientist">Log in</a></p>
                    </div>
                </form>
            </div>


        </div>
    </main>

</body>
</html>
